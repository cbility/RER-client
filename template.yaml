# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/goformation/master/schema/sam.schema.json
# yaml-language-server: disabled=true  # Disable validation - SAM CLI validates correctly
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  rer-client

  AWS lambda function for running https://github.com/cbility/RER-client

Parameters:
  REREmail:
    Type: String
    Default: ""
  RERPassword:
    Type: String
    NoEcho: true
    Default: ""
  GmailTokenJson:
    Type: String
    NoEcho: true
    Default: ""
  GmailTokenFile:
    Type: String
    Default: ""
  SmartSuiteApiUrl:
    Type: String
    Default: "https://app.smartsuite.com/api/v1"
  SmartSuiteApiToken:
    Type: String
    NoEcho: true
    Default: ""
  SmartSuiteAccountId:
    Type: String
    Default: ""
  SmartSuiteTableId:
    Type: String
    Default: ""
  SmartSuiteRecordId:
    Type: String
    Default: ""
  SmartSuiteCookiesField:
    Type: String
    Default: "session_cookies"
  SmartSuiteRefreshedAtField:
    Type: String
    Default: ""
  SmartSuiteTimeoutSeconds:
    Type: String
    Default: "30"
  RerMfaMaxRetries:
    Type: String
    Default: "5"
  RerMfaWaitSeconds:
    Type: String
    Default: "10"
  PlaywrightHeadless:
    Type: String
    Default: "true"

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 30

Resources:
  RERSessionAuthApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        ApiKeyRequired: true

  RERScraperApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        ApiKeyRequired: true

  RERSessionAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Timeout: 300
      MemorySize: 2048
      Architectures:
        - x86_64
      Environment:
        Variables:
          LOG_LEVEL: INFO
          PLAYWRIGHT_HEADLESS: !Ref PlaywrightHeadless
          RER_MFA_MAX_RETRIES: !Ref RerMfaMaxRetries
          RER_MFA_WAIT_SECONDS: !Ref RerMfaWaitSeconds
          RER_EMAIL: !Ref REREmail
          RER_PASSWORD: !Ref RERPassword
          GMAIL_TOKEN_JSON: !Ref GmailTokenJson
          GMAIL_TOKEN_FILE: !Ref GmailTokenFile
          SMARTSUITE_API_URL: !Ref SmartSuiteApiUrl
          SMARTSUITE_API_TOKEN: !Ref SmartSuiteApiToken
          SMARTSUITE_ACCOUNT_ID: !Ref SmartSuiteAccountId
          SMARTSUITE_TABLE_ID: !Ref SmartSuiteTableId
          SMARTSUITE_RECORD_ID: !Ref SmartSuiteRecordId
          SMARTSUITE_COOKIES_FIELD: !Ref SmartSuiteCookiesField
          SMARTSUITE_REFRESHED_AT_FIELD: !Ref SmartSuiteRefreshedAtField
          SMARTSUITE_TIMEOUT_SECONDS: !Ref SmartSuiteTimeoutSeconds
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-RERSessionAuthFunction-*"
      Events:
        CookieRoute:
          Type: Api
          Properties:
            RestApiId: !Ref RERSessionAuthApi
            Path: /
            Method: get
            Auth:
              ApiKeyRequired: true
    Metadata:
      DockerContext: session_auth
      Dockerfile: Dockerfile
      DockerTag: python3.12-playwright-v1

  RERScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: rer_scraper.handler.handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 1024
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600
      Architectures:
        - x86_64
      Environment:
        Variables:
          RER_SESSION_AUTH_API_URL: ""
          RER_SESSION_AUTH_API_KEY_VALUE: ""
          SMARTSUITE_API_URL: !Ref SmartSuiteApiUrl
          SMARTSUITE_API_TOKEN: !Ref SmartSuiteApiToken
          SMARTSUITE_ACCOUNT_ID: !Ref SmartSuiteAccountId
          SMARTSUITE_TIMEOUT_SECONDS: !Ref SmartSuiteTimeoutSeconds
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-RERScraperFunction-*"
      Events:
        ScrapeRoute:
          Type: Api
          Properties:
            RestApiId: !Ref RERScraperApi
            Path: /
            Method: post
            Auth:
              ApiKeyRequired: true

  RERSessionAuthApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - RERSessionAuthApiProdStage
    Properties:
      UsagePlanName: RERSessionAuthUsagePlan
      ApiStages:
        - ApiId: !Ref RERSessionAuthApi
          Stage: Prod

  RERScraperApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - RERScraperApiProdStage
    Properties:
      UsagePlanName: RERScraperUsagePlan
      ApiStages:
        - ApiId: !Ref RERScraperApi
          Stage: Prod

  RERSessionAuthApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Enabled: true
      Name: RERSessionAuthApiKey

  RERScraperApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Enabled: true
      Name: RERScraperApiKey

  RERSessionAuthUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref RERSessionAuthApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref RERSessionAuthApiUsagePlan

  RERScraperUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref RERScraperApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref RERScraperApiUsagePlan

Outputs:
  RERSessionAuthApiUrl:
    Description: "API Gateway endpoint URL for the RER session auth proxy"
    Value: !Sub "https://${RERSessionAuthApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/"
  RERScraperApiUrl:
    Description: "API Gateway endpoint URL for the RER scraper"
    Value: !Sub "https://${RERScraperApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/"
  RERSessionAuthFunction:
    Description: "RER session auth Lambda Function ARN"
    Value: !GetAtt RERSessionAuthFunction.Arn
  RERScraperFunction:
    Description: "RER scraper Lambda Function ARN"
    Value: !GetAtt RERScraperFunction.Arn
  RERSessionAuthFunctionIamRole:
    Description: "Implicit IAM Role created for RER session auth proxy"
    Value: !GetAtt RERSessionAuthFunctionRole.Arn
