[project]
name = "rer-client"
version = "0.1.0"
description = "Automation-friendly client for the Renewable Electricity Register."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.1",
    "pytz>=2026.4",
    "requests>=2.32.5",
    "selectolax>=0.4.7",
    "smartsuite-python",
    "types-requests>=2.33.0.20260518",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "session_auth"]
include = ["rer_client*", "rer_scraper*", "rer_session_auth*"]

[tool.setuptools.package-data]
rer_client = ["py.typed"]

[dependency-groups]
dev = [
    "google-auth>=2.27.0",
    "google-api-python-client>=2.111.0",
    "google-auth-oauthlib>=1.2.0",
    "mypy>=1.19.1",
    "playwright>=1.58.0",
    "pytest>=9.0.2",
    "pyright>=1.1.414",
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "session_auth"]

[tool.pyright]
pythonVersion = "3.12"
extraPaths = ["src", "session_auth"]

[tool.pytest.ini_options]
addopts = "--durations=0 --durations-min=0"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%H:%M:%S"

[tool.uv.sources]
smartsuite-python = { git = "https://github.com/cbility/smartsuite-python.git" }
